<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWAPDROBE – Trao đổi đồ sinh viên</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#121826;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--pri:#0f172a;--pri2:#334155;--accent:#2563eb;--tint:#eff6ff;--ok:#10b981;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--fg:#f8fafc;--mut:#94a3b8;--line:#1e293b;--soft:#1e293b;--tint:#1e3a8a}}
:root[data-theme="dark"]{--bg:#0f172a;--fg:#f8fafc;--mut:#94a3b8;--line:#1e293b;--soft:#1e293b;--tint:#1e3a8a}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:1240px;margin:auto;display:flex;align-items:center;gap:20px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;color:var(--fg)}
.logo-icon{width:36px;height:36px;background:var(--pri);color:#fff;border-radius:8px;display:grid;place-items:center}
.logo span{font-weight:800;font-size:18px;letter-spacing:-.02em}
nav{display:flex;gap:4px;flex:1}
nav button{background:none;border:0;padding:8px 12px;cursor:pointer;font-weight:500;border-bottom:2px solid transparent;position:relative;color:var(--mut)}
nav button.on{border-color:var(--pri);color:var(--fg);font-weight:600}
nav i{font-style:normal;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:4px;font-weight:600}
.me{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 4px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;background:var(--soft);border:1px solid var(--line);color:var(--fg);display:grid;place-items:center;font-weight:600;font-size:12px}
.tick{display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.strip{background:var(--tint);text-align:center;padding:8px 16px;font-size:13px;color:var(--fg)}
.strip button{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;padding:0;margin-left:4px}
main{max-width:1240px;margin:auto;padding:0 20px 60px}
.btn{background:var(--pri);color:#fff;border:0;padding:9px 16px;font-weight:600;cursor:pointer;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.btn:hover{background:var(--pri2)}.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 10px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;background:var(--soft);margin:20px 0 0;padding:48px;border-radius:12px;border:1px solid var(--line)}
.hero h1{font-size:clamp(30px,4.5vw,52px);line-height:1.1;font-weight:800;letter-spacing:-.03em}
.hero p{margin:16px 0 24px;max-width:48ch;color:var(--mut);font-size:16px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.stack{position:relative;height:280px;display:flex;align-items:center;justify-content:center}
.stack-card{position:absolute;width:200px;height:250px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 25px -5px rgba(0,0,0,.08);border:1px solid var(--line);background:var(--bg)}
.stack-card:nth-child(1){transform:translateX(-40px) rotate(-6deg);z-index:1}
.stack-card:nth-child(2){transform:translateY(-10px);z-index:2}
.stack-card:nth-child(3){transform:translateX(40px) rotate(6deg);z-index:1}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:30px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.how div{padding:20px;border-right:1px solid var(--line)}.how div:last-child{border:0}
.how b{display:block;margin-bottom:4px;font-weight:600}.how span{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:22px 0 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.tab.on{border-color:var(--pri);color:var(--fg);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0}
.tools input,.tools select,.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:6px;min-width:0}
.tools input{flex:1;min-width:180px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--mut)}.seg .on{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 16px -4px rgba(0,0,0,.06)}
.card .art{position:relative;aspect-ratio:4/3;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:var(--soft);color:var(--mut)}
.card .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cond{position:absolute;left:8px;bottom:8px;background:rgba(15,23,42,.8);backdrop-filter:blur(4px);color:#fff;font-style:normal;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px}
.cb{padding:14px}.cb h3{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.who,.loc{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:4px;margin-bottom:2px}
.bar{display:flex;gap:6px;margin-top:12px;align-items:center}.bar .btn{flex:1;padding:7px 6px;font-size:13px}
.ic{width:34px;height:34px;border:1px solid var(--line);background:var(--bg);cursor:pointer;border-radius:6px;display:grid;place-items:center;color:var(--mut)}
.ic:hover{background:var(--soft);color:var(--fg)}
.deck{max-width:400px;margin:0 auto}.deck .card .art{aspect-ratio:1}.deck .bar .btn{font-size:14px}
.deckn{text-align:center;color:var(--mut);font-size:13px;margin-top:10px}
.empty{padding:50px 10px;text-align:center;color:var(--mut)}.empty .btn{margin-top:12px}
h2.t{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:30px 0 6px}
.sub{color:var(--mut);margin-bottom:18px;font-size:14px}
.f{display:grid;gap:14px;max-width:640px}.f label{display:grid;gap:5px;font-weight:500;font-size:14px}.f small{color:var(--mut);font-weight:400}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ph{display:flex;gap:8px;flex-wrap:wrap}.ph .p{width:80px;height:80px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;background:var(--soft);cursor:pointer;overflow:hidden;color:var(--mut)}.ph img{width:100%;height:100%;object-fit:cover}
.ol{display:grid;gap:12px;max-width:820px}
.o{border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;background:var(--bg)}
.o .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;background:var(--soft);padding:4px 8px;font-size:13px;border-radius:4px;border:1px solid var(--line)}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--mut)}.st.a{background:var(--tint);color:var(--accent)}.st.d{background:#dcfce7;color:var(--ok)}
.arrow{font-size:16px;color:var(--mut);margin:0 4px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(2px);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--bg);width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;position:relative;border-radius:12px;border:1px solid var(--line);box-shadow:0 20px 25px -5px rgba(0,0,0,.1)}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:6px;padding-right:30px}
.x{position:absolute;right:16px;top:16px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut);width:32px;height:32px;border-radius:6px;display:grid;place-items:center}
.x:hover{background:var(--soft);color:var(--fg)}
.pick{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:6px;cursor:pointer;margin:6px 0}.pick:has(input:checked){border-color:var(--accent);background:var(--tint)}
.spots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.spots label{border:1px solid var(--line);padding:6px 12px;cursor:pointer;border-radius:20px;font-size:13px}.spots label:has(input:checked){background:var(--pri);color:#fff;border-color:var(--pri)}.spots input{display:none}
.chat{border:1px solid var(--line);height:220px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;margin:8px 0;border-radius:6px;background:var(--soft)}
.msg{max-width:80%;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:14px}.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border:0}
.cs{display:flex;gap:6px}.cs input{flex:1;border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:6px}
.stars{display:flex;gap:4px;margin:10px 0}.stars button{background:none;border:0;padding:0;cursor:pointer;color:var(--line)}.stars button.on{color:#f59e0b}
.chk{display:grid;gap:8px;margin:14px 0}.chk div{display:flex;gap:10px;align-items:center;padding:10px;background:var(--soft);border-radius:6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:#fff;padding:10px 20px;z-index:80;border-radius:6px;font-size:14px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:24px 0;padding:20px;background:var(--soft);border-radius:8px;border:1px solid var(--line)}.prof .av{width:64px;height:64px;font-size:24px}
.stats{display:flex;gap:24px;margin:12px 0 0}.stats b{font-size:20px;display:block;line-height:1.2}.stats span{font-size:12px;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--mut);font-size:13px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:24px}.stack{display:none}.how{grid-template-columns:1fr 1fr}.how div{border-bottom:1px solid var(--line)}.hd{gap:8px;padding:8px 12px}.logo span{display:none}nav button{padding:8px 6px;font-size:13px}.me span:last-child{display:none}.me{padding:3px}.r2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header><div class="hd" id="hd"></div><div id="bn"></div></header>
<main id="app"></main>
<footer>SWAPDROBE · Nền tảng trao đổi đồ dành riêng cho sinh viên · Cũ người mới ta.</footer>
<div id="mo"></div><div id="ts"></div>
<script>
const ICONS = {
  book: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`,
  tech: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
  shirt: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path></svg>`,
  home: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`,
  box: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>`,
  heart: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`,
  heartFill: `<svg width="16" height="16" viewBox="0 0 24 24" fill="#ef4444" stroke="#ef4444" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`,
  chat: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`,
  swap: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>`,
  verified: `<svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,
  location: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`,
  star: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`,
  starFill: `<svg width="24" height="24" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`
};

const CATS=['Sách vở/Giáo trình','Đồ điện tử','Quần áo/Phụ kiện','Đồ dùng KTX','Khác'];
const CE={'Sách vở/Giáo trình':ICONS.book,'Đồ điện tử':ICONS.tech,'Quần áo/Phụ kiện':ICONS.shirt,'Đồ dùng KTX':ICONS.home,'Khác':ICONS.box};
const SCH=['ĐH Ngoại Thương','ĐH Bách Khoa','ĐH Quốc Gia','ĐH Kinh tế Quốc dân','ĐH Sư phạm','ĐH Y Hà Nội','ĐH FPT'];
const CONDS=['Mới 100%','Mới 95%','Mới 90%','Mới 85%','Mới 80%','Cũ 70%'];
const SPOTS=['Cổng trường','Thư viện','KTX','Quán cafe gần trường','Căng tin'];
const mk=(id,t,cat,cond,who,school,loc,desc,want)=>({id,t,cat,cond,who,school,loc,desc,want});
const SEED=[
mk(1,'Giáo trình Kinh tế vi mô','Sách vở/Giáo trình','Mới 90%','Linh Trần','ĐH Bách Khoa','KTX Khu B','Bản mới nhất, có highlight nhẹ ở chương 3–5.','Quạt mini hoặc tai nghe'),
mk(2,'Quạt tích điện để bàn','Đồ dùng KTX','Mới 95%','Minh Anh','ĐH Ngoại Thương','Cổng trường','Pin dùng được khoảng 6 tiếng, 3 tốc độ gió.','Sách tiếng Anh'),
mk(3,'Áo khoác denim oversize','Quần áo/Phụ kiện','Mới 90%','Hà My','ĐH Kinh tế Quốc dân','Thư viện','Size M, form rộng, mặc 3–4 lần.','Hoodie hoặc túi tote'),
mk(4,'Tai nghe Sony có dây','Đồ điện tử','Mới 85%','Đức Long','ĐH Quốc Gia','Cơ sở 1','Âm thanh tốt, jack 3.5mm, đệm tai còn mềm.','Sách IELTS'),
mk(5,'Máy tính Casio fx-580VN X','Đồ điện tử','Mới 95%','Bảo Ngọc','ĐH Quốc Gia','Thư viện','Đã dùng 1 kỳ, còn hộp và nắp.','Đèn học'),
mk(6,'Đèn học LED kẹp bàn','Đồ dùng KTX','Mới 90%','Quang Huy','ĐH Bách Khoa','KTX Khu A','3 mức sáng, kẹp chắc, dây dài 1.5m.','Nồi cơm mini'),
mk(7,'Túi tote canvas in hình','Quần áo/Phụ kiện','Mới 95%','Thu Trang','ĐH Sư phạm','Cổng trường','Vải dày, có khoá kéo và túi phụ.','Áo thun basic'),
mk(8,'Cambridge IELTS 16 + đáp án','Sách vở/Giáo trình','Mới 90%','Phương Vy','ĐH Ngoại Thương','Căng tin','Chưa viết vào sách, kèm file audio.','Bàn phím hoặc chuột'),
mk(9,'Bàn phím cơ 87 phím','Đồ điện tử','Mới 90%','Tuấn Kiệt','ĐH FPT','Cơ sở 2','Switch đỏ, có keycap thay thế.','Loa mini'),
mk(10,'Nồi cơm điện mini 0.6L','Đồ dùng KTX','Mới 85%','Ngọc Bích','ĐH Y Hà Nội','KTX Khu C','Nấu 1–2 người, có xửng hấp.','Đèn học'),
mk(11,'Hoodie basic màu xám','Quần áo/Phụ kiện','Mới 95%','Gia Hân','ĐH Kinh tế Quốc dân','Thư viện','Size L, nỉ dày, không xù lông.','Áo khoác nhẹ'),
mk(12,'Bộ dụng cụ vẽ kỹ thuật','Khác','Mới 90%','Hoàng Nam','ĐH Bách Khoa','KTX Khu A','Thước, compa, bút kim đủ bộ.','Sách chuyên ngành')];
let S={user:null,items:SEED,saved:[],offers:[],chats:{},reviews:[],n:100};
try{const r=localStorage.getItem('swapdrobe');if(r)S=Object.assign(S,JSON.parse(r))}catch(_){}
const save=()=>{try{localStorage.setItem('swapdrobe',JSON.stringify(S,(k,v)=>k==='imgs'?undefined:v))}catch(_){}};
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);
const ver=()=>S.user&&S.user.st==='v',isMe=n=>S.user&&n===S.user.name,item=id=>S.items.find(i=>i.id==id),TK=ICONS.verified;
let view='home',F={cat:'',school:'',q:'',mode:'grid'},D=0,W={};
function toast(m){$('#ts').innerHTML=`<div class="toast" role="status">${e(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#ts').innerHTML='',2600)}
function modal(h){$('#mo').innerHTML=`<div class="ov" data-a="bg"><div class="sheet" role="dialog" aria-modal="true"><button class="x" data-a="close" aria-label="Đóng">✕</button>${h}</div></div>`}
const closeM=()=>$('#mo').innerHTML='';
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeM()});
function go(v){view=v;render();scrollTo(0,0)}
function gate(){if(!S.user){authM();return 0}if(!ver()){verifyM();toast('Cần xác thực thẻ sinh viên để tiếp tục');return 0}return 1}
const pending=()=>S.offers.filter(o=>o.to===S.user?.name&&o.status==='pending').length;

function head(){
const n=(v,t,x='')=>`<button class="${view===v?'on':''}" data-a="go" data-id="${v}">${t}${x}</button>`;
$('#hd').innerHTML=`<button class="logo" data-a="go" data-id="home" aria-label="SWAPDROBE trang chủ"><div class="logo-icon">${ICONS.swap}</div><span>SWAPDROBE</span></button>
<nav>${n('home','Khám phá')}${n('up','Đăng đồ')}${n('swaps','Swap của tôi',pending()?`<i>${pending()}</i>`:'')}${n('saved','Đã lưu')}</nav>
${S.user?`<button class="me" data-a="go" data-id="prof"><span class="av">${e(S.user.name[0])}</span><span>${e(S.user.name.split(' ').pop())}</span>${ver()?TK:''}</button>`:`<button class="btn" data-a="auth">Đăng nhập / Đăng ký</button>`;
$('#bn').innerHTML=S.user&&!ver()?`<div class="strip">Tài khoản chưa xác thực: bạn chỉ có thể xem đồ. <button data-a="verify">Xác thực thẻ sinh viên</button></div>`:''
}

function card(i){const mine=isMe(i.who);
return `<article class="card"><div class="art" data-a="open" data-id="${i.id}" role="button" tabindex="0" aria-label="Xem ${e(i.t)}">${i.imgs&&i.imgs[0]?`<img src="${i.imgs[0]}" alt="">`:CE[i.cat]}<em class="cond">${i.cond}</em></div>
<div class="cb"><h3>${e(i.t)}</h3><p class="who">${e(i.who)} ${TK} · ${e(i.school)}</p><p class="loc">${ICONS.location} ${e(i.loc)}</p>
<div class="bar"><button class="ic" data-a="fav" data-id="${i.id}" aria-label="Lưu">${S.saved.includes(i.id)?ICONS.heartFill:ICONS.heart}</button>${mine?'<span class="who">Đồ của bạn</span>':`<button class="ic" data-a="chat" data-id="${i.id}" aria-label="Hỏi nhanh">${ICONS.chat}</button><button class="btn" data-a="offer" data-id="${i.id}">${ICONS.swap} Offer Swap</button>`}</div></div></article>`}

function list(){return S.items.filter(i=>(!F.cat||i.cat===F.cat)&&(!F.school||i.school===F.school)&&(!F.q||(i.t+' '+i.desc+' '+i.who).toLowerCase().includes(F.q.toLowerCase())))}

function grid(){const l=list(),g=$('#grid');if(!g)return;
if(!l.length){g.className='';g.innerHTML=`<div class="empty"><p>Chưa có món đồ nào khớp bộ lọc.</p><button class="btn ghost" data-a="reset">Xoá bộ lọc</button></div>`;return}
if(F.mode==='deck'){D=Math.min(D,l.length-1);g.className='deck';g.innerHTML=card(l[D])+`<div class="bar" style="margin-top:14px"><button class="btn ghost" data-a="prev">‹ Trước</button><button class="btn ghost" data-a="next">Bỏ qua ›</button></div><p class="deckn">${D+1} / ${l.length}</p>`}
else{g.className='grid';g.innerHTML=l.map(card).join('')}}

const V={};
V.home=()=>`<section class="hero"><div><h1>Trao đổi đồ dùng sinh viên dễ dàng.</h1><p>Giải pháp tiết kiệm, văn minh cho cộng đồng sinh viên. Đổi món đồ bạn không dùng lấy thứ bạn đang cần.</p><div class="cta"><button class="btn" data-a="scroll">Bắt đầu lướt</button><button class="btn ghost" data-a="go" data-id="up">Đăng món đồ đầu tiên</button></div></div><div class="stack" aria-hidden="true"><div class="stack-card">${ICONS.book}<span>Giáo trình</span></div><div class="stack-card">${ICONS.tech}<span>Đồ điện tử</span></div><div class="stack-card">${ICONS.shirt}<span>Trang phục</span></div></div></section>
<section class="how"><div><b>1. Xác thực</b><span>Email .edu.vn & Thẻ sinh viên</span></div><div><b>2. Gửi offer</b><span>Chọn món của bạn để đổi</span></div><div><b>3. Hẹn gặp</b><span>Địa điểm an toàn gần trường</span></div><div><b>4. Đánh giá</b><span>Hoàn tất & tích luỹ uy tín</span></div></section>
<div class="tabs" id="tabs"><button class="tab on" data-a="cat" data-id="">Tất cả</button>${CATS.map(c=>`<button class="tab" data-a="cat" data-id="${c}">${CE[c]}${c}</button>`).join('')}</div>
<div class="tools"><input id="q" type="search" placeholder="Tìm giáo trình, quạt, áo khoác…" aria-label="Tìm kiếm"><select id="sc" aria-label="Lọc theo trường"><option value="">Tất cả trường / khu vực</option>${SCH.map(s=>`<option>${s}</option>`).join('')}</select><div class="seg"><button class="on" data-a="mode" data-id="grid">Lưới</button><button data-a="mode" data-id="deck">Lướt card</button></div></div><div id="grid"></div>`;

V.saved=()=>{const l=S.items.filter(i=>S.saved.includes(i.id));return `<h2 class="t">Đã lưu</h2><p class="sub">Những món bạn muốn quay lại xem.</p>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty"><p>Bạn chưa lưu món nào.</p><button class="btn" data-a="go" data-id="home">Đi khám phá</button></div>`}`};

V.up=()=>`<h2 class="t">Đăng đồ</h2><p class="sub">Đăng món đồ bạn không sử dụng tới để tìm kiếm giao dịch phù hợp.</p>
<form class="f" id="uf" onsubmit="return false"><div style="display:grid;gap:5px;font-weight:500;font-size:14px">Ảnh sản phẩm (tối đa 5)<div class="ph" id="ph"></div><input id="pf" type="file" accept="image/*" multiple hidden></div>
<label>Tên sản phẩm<input id="u1" maxlength="70" placeholder="VD: Giáo trình Giải tích 1"></label>
<div class="r2"><label>Danh mục<select id="u2">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Tình trạng<select id="u3">${CONDS.map(c=>`<option>${c}</option>`).join('')}</select></label></div>
<label>Mô tả chi tiết<textarea id="u4" rows="3" maxlength="200" placeholder="Thông tin chi tiết về tình trạng sử dụng..."></textarea></label>
<label>Nhu cầu đổi lại <small>(Không bắt buộc)</small><input id="u5" placeholder="VD: Quạt mini, Sách tiếng Anh"></label>
<label>Vị trí giao dịch<input id="u6" placeholder="VD: KTX Khu A, Cơ sở 1"></label>
<button class="btn" data-a="publish">Đăng bài</button></form>`;

V.prof=()=>{if(!S.user)return `<div class="empty"><p>Đăng nhập để xem hồ sơ.</p><button class="btn" data-a="auth">Đăng nhập / Đăng ký</button></div>`;const u=S.user,my=S.items.filter(i=>isMe(i.who)),done=S.offers.filter(o=>o.status==='done').length;
return `<div class="prof"><span class="av">${e(u.name[0])}</span><div><h2 class="t" style="margin:0">${e(u.name)} ${ver()?TK:''}</h2><p class="who">${e(u.school)} · ${e(u.email)}</p><p style="margin-top:6px">${ver()?`<span class="st d">Đã xác thực · MSSV ${e(u.sid)}</span>`:`<span class="st">Chưa xác thực</span> <button class="btn sm" data-a="verify">Xác thực ngay</button>`}</p>
<div class="stats"><div><b>${my.length}</b><span>Đang đăng</span></div><div><b>${done}</b><span>Đã hoàn thành</span></div><div><b>${S.reviews.length?(S.reviews.reduce((a,r)=>a+r.s,0)/S.reviews.length).toFixed(1):'–'}</b><span>Đánh giá</span></div></div></div></div>
<h3>Đồ của tôi</h3>${my.length?`<div class="grid" style="margin:12px 0 26px">${my.map(card).join('')}</div>`:`<p class="sub">Chưa có bài đăng nào. <a href="#" data-a="go" data-id="up">Đăng bài mới</a></p>`}
<h3>Đánh giá gần đây</h3>${S.reviews.length?S.reviews.map(r=>`<p style="margin:8px 0;font-size:14px"><span style="color:#f59e0b">${'★'.repeat(r.s)}</span> từ <b>${e(r.about)}</b>${r.t?'· '+e(r.t):''}</p>`).join(''):'<p class="sub">Chưa có đánh giá nào.</p>'}
<p style="margin-top:30px"><button class="btn ghost sm" data-a="logout">Đăng xuất</button></p>`};

V.swaps=()=>{if(!S.user)return `<div class="empty"><p>Đăng nhập để quản lý đề nghị đổi đồ.</p><button class="btn" data-a="auth">Đăng nhập / Đăng ký</button></div>`;
const me=S.user.name,l=[...S.offers].reverse();
const mini=i=>i?`<span class="mini">${CE[i.cat]} ${e(i.t)}</span>`:'';
return `<h2 class="t">Swap của tôi</h2><p class="sub">Quản lý các lời đề nghị và lịch hẹn giao dịch.</p><div class="ol">${l.length?l.map(o=>{const inn=o.to===me,other=inn?o.by:o.to,stt={pending:['Chờ phản hồi',''],acc:['Đã chấp nhận','a'],done:['Hoàn thành','d'],no:['Đã từ chối','']}[o.status];
return `<div class="o"><div class="row"><b style="font-size:14px">${inn?'Đề nghị từ':'Đề nghị tới'} ${e(other)}</b><span class="st ${stt[1]}">${stt[0]}</span></div>
<div class="row">${o.give.map(id=>mini(item(id))).join('')}<span class="arrow">⇄</span>${mini(item(o.target))}</div>${o.note?`<p class="who">“${e(o.note)}”</p>`:''}${o.when?`<p class="who">${ICONS.location} ${e(o.where)} · 🕒 ${e(o.when)}</p>`:''}
<div class="row">${o.status==='pending'&&inn?`<button class="btn sm" data-a="accept" data-id="${o.id}">Chấp nhận</button><button class="btn ghost sm" data-a="decline" data-id="${o.id}">Từ chối</button>`:''}
${o.status==='pending'&&!inn?`<button class="btn ghost sm" data-a="cancel" data-id="${o.id}">Hủy đề nghị</button><button class="btn ghost sm" data-a="fake" data-id="${o.id}">Demo: Chấp nhận</button>`:''}
${o.status==='acc'?`<button class="btn sm" data-a="meet" data-id="${o.id}">Hẹn địa điểm & Chat</button>${o.doneMe?'<span class="who">Đang chờ xác nhận…</span>':`<button class="btn ghost sm" data-a="complete" data-id="${o.id}">Hoàn tất giao dịch</button>`}`:''}
${o.status==='done'&&!o.rated?`<button class="btn sm" data-a="rate" data-id="${o.id}">Đánh giá ${e(other)}</button>`:''}</div></div>`}).join(''):`<div class="empty"><p>Chưa có đề nghị nào.</p><button class="btn" data-a="go" data-id="home">Đi khám phá</button></div>`}</div>`};

function render(){head();$('#app').innerHTML=V[view]();if(view==='home')grid();if(view==='up')photos()}

function authM(){W={};modal(`<h3>Tạo tài khoản sinh viên</h3><p class="sub">Sử dụng email .edu.vn để xác minh danh tính.</p><div class="f" id="af">
<label>Họ và tên<input id="a1" autocomplete="name"></label><label>Trường Đại học / Cao đẳng<select id="a2">${SCH.map(s=>`<option>${s}</option>`).join('')}</select></label>
<label>Email sinh viên<input id="a3" type="email" placeholder="ten.sv@truong.edu.vn" autocomplete="email"></label><p id="ae" class="who" style="color:var(--accent)"></p><button class="btn" data-a="otp">Gửi mã OTP</button></div>`)}

function otpStep(){modal(`<h3>Nhập mã OTP</h3><p class="sub">Mã xác thực đã được gửi tới ${e(W.email)}. <b>(Mã Demo: ${W.code})</b></p><div class="f"><label>Mã OTP<input id="a4" inputmode="numeric" maxlength="6"></label><p id="ae" class="who" style="color:var(--accent)"></p><button class="btn" data-a="otpok">Xác nhận</button></div>`)}

function verifyM(){modal(`<h3>Xác thực thẻ sinh viên</h3><p class="sub">Tải ảnh thẻ sinh viên để mở khóa đầy đủ tính năng giao dịch.</p><div class="f" id="vf"><div class="r2"><label>Mặt trước<input id="v1" type="file" accept="image/*"></label><label>Mặt sau<input id="v2" type="file" accept="image/*"></label></div>
<label>Mã sinh viên<input id="v3" placeholder="VD: 2211110045"></label><p class="who">Họ tên: ${e(S.user.name)} · Trường: ${e(S.user.school)}</p><p id="ae" class="who" style="color:var(--accent)"></p><button class="btn" data-a="scan">Gửi xác thực</button></div>`)}

function scan(){const sid=$('#v3').value.trim();if(!$('#v1').files[0]||!$('#v2').files[0])return $('#ae').textContent='Hãy tải đủ ảnh 2 mặt thẻ.';if(sid.length<6)return $('#ae').textContent='Mã sinh viên không hợp lệ.';
const rows=[['Mã sinh viên',sid],['Họ và tên',S.user.name],['Trường',S.user.school]];
$('#vf').innerHTML=`<div class="chk">${rows.map((r,k)=>`<div id="c${k}">Đang xử lý ${r[0]}…</div>`).join('')}</div>`;
rows.forEach((r,k)=>setTimeout(()=>{$('#c'+k).innerHTML=`✓ ${r[0]}: <b>${e(r[1])}</b>`;if(k===2)setTimeout(()=>finish(sid),600)},600*(k+1)))}

function finish(sid){S.user.st='v';S.user.sid=sid;const me=S.user.name;
if(!S.items.some(i=>isMe(i.who))){S.items.unshift(mk(S.n++,'Áo thun basic trắng','Quần áo/Phụ kiện','Mới 95%',me,S.user.school,'Cổng trường','Cotton 100%, size M, ít mặc.','Sách chuyên ngành'),mk(S.n++,'Sổ tay ô ly A5 (3 quyển)','Khác','Mới 100%',me,S.user.school,'Thư viện','Chưa viết, bìa cứng.','Bút hoặc đèn học'));
S.offers.push({id:S.n++,by:'Linh Trần',to:me,target:S.items[0].id,give:[4],note:'Mình muốn đổi tai nghe Sony lấy áo của bạn.',status:'pending',msgs:[]})}
save();render();modal(`<h3>Xác thực thành công ${TK}</h3><p class="sub">Tài khoản của bạn đã được chứng thực. Bạn đã có thể đăng bài và gửi đề nghị trao đổi.</p><button class="btn" data-a="close">Bắt đầu ngay</button>`)}

function offerM(id){const t=item(id),my=S.items.filter(i=>isMe(i.who));W.t=id;
modal(`<h3>Đề nghị đổi đồ cho “${e(t.t)}”</h3><p class="sub">Chọn từ 1 đến 3 món đồ của bạn để đề nghị trao đổi.</p>
${my.length?my.map(i=>`<label class="pick"><input type="checkbox" value="${i.id}"><span style="display:flex;align-items:center">${CE[i.cat]}</span><span><b>${e(i.t)}</b><br><small class="who">${i.cond}</small></span></label>`).join(''):`<div class="empty"><p>Bạn chưa có bài đăng nào.</p><button class="btn" data-a="go" data-id="up">Đăng đồ ngay</button></div>`}
${my.length?`<div class="f" style="margin-top:12px"><label>Ghi chú<input id="on" maxlength="120" placeholder="Thêm lời nhắn tới người đăng..."></label><p id="ae" class="who" style="color:var(--accent)"></p><button class="btn" data-a="send">Gửi đề nghị</button></div>`:''}`)}

function chatBox(k){return `<div class="chat" id="cl">${(S.chats[k]||[]).map(m=>`<div class="msg ${m.me?'me':''}">${e(m.t)}</div>`).join('')||'<span class="who">Chưa có tin nhắn nào.</span>'}</div><div class="cs"><input id="ci" placeholder="Nhập tin nhắn…" aria-label="Tin nhắn"><button class="btn sm" data-a="say" data-id="${k}">Gửi</button></div>`}
function chatM(k,title){modal(`<h3>${e(title)}</h3>${chatBox(k)}`)}

function meetM(id){const o=S.offers.find(x=>x.id==id),other=o.by===S.user.name?o.to:o.by,d=new Date().toISOString().slice(0,10);W.o=id;
modal(`<h3>Hẹn thời gian & địa điểm với ${e(other)}</h3><p class="sub">Lựa chọn khu vực công cộng an toàn tiện cho cả hai.</p><div class="f"><div class="spots">${SPOTS.map(s=>`<label><input type="radio" name="sp" value="${s}" ${o.where===s?'checked':''}>${s}</label>`).join('')}</div>
<div class="r2"><label>Ngày<input id="md" type="date" min="${d}" value="${o.date||d}"></label><label>Giờ<input id="mt" type="time" value="${o.time||'12:00'}"></label></div><button class="btn" data-a="plan">Xác nhận lịch hẹn</button></div>
<h3 style="margin-top:20px;font-size:15px">Tương tác trực tiếp</h3>${chatBox('o'+id)}`)}

function rateM(id){W={o:id,s:0};modal(`<h3>Đánh giá giao dịch</h3><p class="sub">Gửi phản hồi về mức độ hài lòng của bạn.</p><div class="stars" id="st">${[1,2,3,4,5].map(n=>`<button data-a="star" data-id="${n}" aria-label="${n} sao">${ICONS.star}</button>`).join('')}</div><div class="f"><label>Nhận xét<input id="rt" maxlength="120" placeholder="Mô tả trải nghiệm của bạn..."></label><p id="ae" class="who" style="color:var(--accent)"></p><button class="btn" data-a="rsend">Gửi đánh giá</button></div>`)}

function photos(){W.im=W.im||[];$('#ph').innerHTML=W.im.map(s=>`<div class="p"><img src="${s}" alt=""></div>`).join('')+(W.im.length<5?`<div class="p" id="add" role="button" tabindex="0" aria-label="Thêm ảnh">+</div>`:'')}

const A={
go:id=>{closeM();go(id)},close:closeM,bg:(id,b,ev)=>{if(ev.target===b)closeM()},auth:authM,verify:verifyM,scan,
scroll:()=>$('#tabs').scrollIntoView({behavior:'smooth'}),
cat:id=>{F.cat=id;D=0;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id));grid()},
mode:(id,b)=>{F.mode=id;D=0;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));grid()},
reset:()=>{F.cat='';F.school='';F.q='';render()},prev:()=>{D=Math.max(0,D-1);grid()},next:()=>{D=Math.min(list().length-1,D+1);grid()},
fav:id=>{id=+id;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];save();view==='saved'?render():grid();if(view!=='home'&&view!=='saved')render();toast(S.saved.includes(id)?'Đã lưu món đồ':'Đã bỏ lưu')},
open:id=>{const i=item(id),mine=isMe(i.who);modal(`<div class="card"><div class="art" style="cursor:default;aspect-ratio:16/9">${i.imgs&&i.imgs[0]?`<img src="${i.imgs[0]}" alt="">`:CE[i.cat]}<em class="cond">${i.cond}</em></div></div><h3 style="margin-top:14px">${e(i.t)}</h3><p class="who">${e(i.who)} ${TK} · ${e(i.school)} · ${ICONS.location} ${e(i.loc)}</p><p style="margin:10px 0;font-size:14px">${e(i.desc)||'Chưa có mô tả.'}</p>${i.want?`<p class="mini">Nhu cầu đổi: <b>${e(i.want)}</b></p>`:''}<div class="bar" style="margin-top:14px">${mine?'<span class="who">Đây là đồ của bạn</span>':`<button class="ic" data-a="chat" data-id="${i.id}">${ICONS.chat}</button><button class="btn" data-a="offer" data-id="${i.id}">${ICONS.swap} Offer Swap</button>`}</div>`)},
chat:id=>{if(!S.user)return authM();const i=item(id);chatM('i'+id,'Liên hệ với '+i.who)},
say:k=>{const v=$('#ci').value.trim();if(!v)return;(S.chats[k]=S.chats[k]\vert{}\vert{}[]).push({me:1,t:v});$('#ci').value='';paint(k);save();
setTimeout(()=>{(S.chats[k]=S.chats[k]||[]).push({t:['Ghi nhận thông tin từ bạn.','Thời gian đó mình hợp lý nhé.','Sản phẩm vẫn còn đúng như mô tả.'][S.chats[k].length%3]});paint(k);save()},1000)},
offer:id=>{if(gate())offerM(id)},
send:()=>{const g=[...document.querySelectorAll('.pick input:checked')].map(x=>+x.value);if(!g.length||g.length>3)return $('#ae').textContent='Vui lòng chọn từ 1 đến 3 món.';
const t=item(W.t);S.offers.push({id:S.n++,by:S.user.name,to:t.who,target:t.id,give:g,note:$('#on').value.trim(),status:'pending',msgs:[]});save();closeM();go('swaps');toast('Đã gửi đề nghị trao đổi')},
accept:id=>{const o=S.offers.find(x=>x.id==id);o.status='acc';save();render();meetM(id)},
decline:id=>{S.offers.find(x=>x.id==id).status='no';save();render()},
cancel:id=>{S.offers=S.offers.filter(x=>x.id!=id);save();render()},
fake:id=>{S.offers.find(x=>x.id==id).status='acc';save();render();toast('Đề nghị đã được chấp nhận.')},
meet:meetM,
plan:()=>{const o=S.offers.find(x=>x.id==W.o),s=document.querySelector('input[name=sp]:checked');if(!s)return toast('Vui lòng chọn địa điểm');o.where=s.value;o.date=$('#md').value;o.time=$('#mt').value;o.when=o.date.split('-').reverse().join('/')+' lúc '+o.time;save();render();closeM();toast('Đã cập nhật lịch hẹn')},
complete:id=>{const o=S.offers.find(x=>x.id==id);o.doneMe=1;save();render();toast('Đã hoàn tất. Đang chờ đối phương xác nhận...');
setTimeout(()=>{o.status='done';save();if(view==='swaps')render();toast('Giao dịch hoàn tất!')},1500)},
rate:rateM,
star:id=>{W.s=+id;document.querySelectorAll('#st button').forEach((b,k)=>{b.innerHTML=k<W.s?ICONS.starFill:ICONS.star;b.classList.toggle('on',k<W.s)})},
rsend:()=>{if(!W.s)return $('#ae').textContent='Vui lòng chọn số sao đánh giá.';
const o=S.offers.find(x=>x.id==W.o);o.rated=1;S.reviews.push({s:W.s,about:o.by===S.user.name?o.to:o.by,t:$('#rt').value.trim()});save();closeM();render();toast('Đã gửi đánh giá')},
otp:()=>{const name=$('#a1').value.trim(),email=$('#a3').value.trim();if(!name\vert{}\vert{}!email.endsWith('.edu.vn'))return $('#ae').textContent='Yêu cầu nhập đúng Email sinh viên (.edu.vn)';
W={name,school:$('#a2').value,email,code:String(Math.floor(100000+Math.random()*900000))};otpStep()},
otpok:()=>{if($('#a4').value.trim()!==W.code)return $('#ae').textContent='Mã OTP không chính xác.';
S.user={name:W.name,school:W.school,email:W.email,st:'u'};save();closeM();render();verifyM()},
logout:()=>{if(confirm('Bạn có chắc chắn muốn đăng xuất?')){S.user=null;save();render()}},
publish:()=>{const t=$('#u1').value.trim();if(!t)return toast('Vui lòng nhập tên sản phẩm.');
S.items.unshift(mk(S.n++,t,$('#u2').value,$('#u3').value,S.user.name,S.user.school,$('#u6').value.trim()||'Tại trường',$('#u4').value.trim(),$('#u5').value.trim()));
if(W.im&&W.im.length)S.items[0].imgs=[...W.im];W.im=[];save();go('home');toast('Đã đăng bài mới thành công')}
};

function paint(k){const c=$('#cl');if(c){c.innerHTML=(S.chats[k]||[]).map(m=>`<div class="msg ${m.me?'me':''}">${e(m.t)}</div>`).join('');c.scrollTop=c.scrollHeight}}

document.addEventListener('click',ev=>{
const b=ev.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,id=b.dataset.id;
if(A[a])A[a](id,b,ev);
});

document.addEventListener('input',ev=>{
if(ev.target.id==='q'){F.q=ev.target.value;grid()}
if(ev.target.id==='sc'){F.school=ev.target.value;grid()}
if(ev.target.id==='pf'){
  const files=[...ev.target.files].slice(0,5-W.im.length);
  files.forEach(f=>{const r=new FileReader();r.onload=e=>{W.im.push(e.target.result);photos()};r.readAsDataURL(f)});
}
});

document.addEventListener('click',ev=>{
if(ev.target.id==='add') $('#pf').click();
});

render();
</script></body></html>
